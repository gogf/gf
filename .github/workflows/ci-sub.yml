# The sub codes build and unit testing running workflow.
# It maintains the ci of unimportant packages.
name: GoFrame Sub CI


on:
  push:
    branches:
    - master
    - develop
    - personal/**
    - feature/**
    - enhance/**
    - fix/**

  pull_request:
    branches:
    - master
    - develop
    - personal/**
    - feature/**
    - enhance/**
    - fix/**

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  TZ: "Asia/Shanghai"
  # for unit testing cases of some components that only execute on the latest go version.
  LATEST_GO_VERSION: "1.26"

jobs:
  code-test:
    strategy:
      matrix:
        # 🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥
        # When adding new go version to the list, make sure:
        # 1. Update the `LATEST_GO_VERSION` env variable.
        # 🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥
        go-version: [ "1.23", "1.24", "1.25", "1.26" ]
        goarch: [ "386", "amd64" ]

    runs-on: ubuntu-latest

    steps:
    - name: Setup Timezone
      run:  sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Start Minikube
      uses: medyagh/setup-minikube@master

    - name: Setup Golang ${{ matrix.go-version }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        # Cache is managed manually below.
        cache: false

    - name: Get current month
      id: cache-month
      run: echo "month=$(date +%Y%m)" >> "$GITHUB_OUTPUT"

    # Downloaded modules are independent of the Go version and architecture, so the
    # key omits both and all eight matrix entries share a single cache entry.
    # The examples repository is cloned at runtime, so its go.sum files cannot take
    # part in the key; the restore-keys tier covers that drift.
    - name: Restore Go module cache
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-mod-sub-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-mod-sub-

    # Go build cache is content-addressed, so stale entries are simply not hit and it
    # is safe to restore across source changes. It is restored for every matrix entry
    # but only saved once (see the save step below) to stay within the 10GB budget.
    - name: Restore Go build cache
      id: build-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-go-build-sub-${{ matrix.go-version }}-${{ matrix.goarch }}-${{ steps.cache-month.outputs.month }}
        restore-keys: |
          ${{ runner.os }}-go-build-sub-${{ matrix.go-version }}-${{ matrix.goarch }}-
          ${{ runner.os }}-go-build-sub-${{ matrix.go-version }}-
          ${{ runner.os }}-go-build-sub-

    - name: Before Script
      run:  bash .github/workflows/scripts/before_script.sh

    - name: Build & Test
      run: bash .github/workflows/scripts/ci-sub.sh

    # Only one canonical matrix entry writes the build cache back, keeping all eight
    # matrix entries inside the repository's 10GB cache budget.
    - name: Save Go build cache
      # `cache-hit` is true when this month's entry already exists; saving again would
      # fail, as cache entries are immutable.
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.go-version == env.LATEST_GO_VERSION && matrix.goarch == 'amd64' && steps.build-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/go-build
        key: ${{ steps.build-cache.outputs.cache-primary-key }}


