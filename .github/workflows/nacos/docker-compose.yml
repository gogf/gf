version: "3.8"

services:
  nacos:
    image: nacos/nacos-server:v2.1.2
    container_name: nacos
    env_file:
      - ./env/nacos.env
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9555:9555"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8848/nacos" ]
      interval: 5s
      timeout: 3s
      retries: 10
      # Nacos is a JVM service and needs well over the 50s that interval*retries
      # allows on a loaded runner. Without start_period those early failures
      # count towards retries, the container is declared unhealthy, and the
      # initializer that depends on it never runs.
      start_period: 180s

  initializer:
    image: alpine/curl:latest
    depends_on:
      nacos:
        condition: service_healthy
    command: [ "sh", "-c", "curl -X POST 'http://nacos:8848/nacos/v1/cs/configs?dataId=config.toml&group=test&content=%5Bserver%5D%0A%09address%3D%22%3A8000%22'" ]
