# The main codes build and unit testing running workflow.
name: GoFrame Main CI


on:
  push:
    branches:
    - master
    - develop
    - personal/**
    - feature/**
    - enhance/**
    - fix/**

  pull_request:
    branches:
    - master
    - develop
    - personal/**
    - feature/**
    - enhance/**
    - fix/**
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: 'Enable tmate Debug'
        required: false
        default: false

# This allows a subsequently queued workflow run to interrupt previous runs.
# Runs on master are never cancelled: a cancelled matrix leg would leave its commit
# with a partial coverage report, as only part of the Codecov uploads would arrive.
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  TZ: "Asia/Shanghai"
  # for unit testing cases of some components that only execute on the latest go version.
  LATEST_GO_VERSION: "1.27"

jobs:
  code-test:
    strategy:
      matrix:
        # 🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥
        # When adding new go version to the list, make sure:
        # 1. Update the `LATEST_GO_VERSION` env variable.
        # 2. Update the go version of the `include` entries.
        # 🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥
        go-version: [ "1.25", "1.26", "1.27" ]
        group: [ "core" ]
        include:
          - go-version: "1.27"
            group: "drivers-1"
          - go-version: "1.27"
            group: "drivers-2"
          - go-version: "1.27"
            group: "386"

    runs-on: ubuntu-latest


    steps:
    - name: Setup Timezone
      run:  sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup tmate Session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
      with:
        detached: true
        limit-access-to-actor: false

    - name: Free Disk Space
      # Runs before any image is pulled: the runner has only ~5GB left once the
      # toolcache and the preinstalled SDKs are counted in, which is not enough for the
      # service images of the drivers groups. The Go toolcache is kept, as setup-go
      # resolves the matrix versions from it.
      #
      # No `docker system prune` / `docker builder prune` here: the runner is fresh, so
      # both reported "Total reclaimed space: 0B" while still enumerating every image,
      # container, volume and build cache entry. The services are started after this
      # step anyway, so there is nothing of ours to reclaim at this point.
      run: |
        df -h /
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /usr/local/share/boost \
          /usr/share/swift \
          /opt/ghc \
          /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL \
          /opt/hostedtoolcache/Python \
          /opt/hostedtoolcache/PyPy \
          /opt/hostedtoolcache/Ruby \
          /opt/hostedtoolcache/node || true
        df -h /

    # Services are started here instead of in a job level `services:` block. Those are
    # created in the "Initialize containers" phase before any step runs, so every image
    # was pulled at once and the disk ran out before "Free Disk Space" above could run.
    # Starting them per group also keeps `386` from pulling images it never uses.
    - name: Start Services
      run: |
        case "${{ matrix.group }}" in
          386)
            echo "The 386 group only builds the root module and needs no service."
            exit 0
            ;;
          core)
            # `cmd/gf` belongs to this group and its tests hit real mysql, mariadb and
            # postgres instances on every Go version, while the contrib backends below
            # are only exercised on the latest one (see ci-main.sh).
            services="mysql mariadb postgres"
            if [ "${{ matrix.go-version }}" = "$LATEST_GO_VERSION" ]; then
              services="mysql mariadb postgres etcd redis polaris zookeeper"
            fi
            ;;
          drivers-1)
            services="mssql oracle dm oceanbase"
            ;;
          drivers-2)
            services="mysql mariadb postgres clickhouse gaussdb tidb"
            ;;
          *)
            echo "Unknown group '${{ matrix.group }}': add its services here." >&2
            exit 1
            ;;
        esac
        bash .github/workflows/scripts/docker-services.sh start "$services"
        # The `services:` block waited for the containers declaring a HEALTHCHECK to
        # report `healthy` before running any step, and several test packages connect
        # from a package level `init()` and fail at once. The same wait is reproduced
        # here: `healthy` where a HEALTHCHECK is declared, an open published port
        # otherwise.
        bash .github/workflows/scripts/docker-services.sh wait "$services"

    # The config and registry backends of the core group are multi-container setups and
    # keep their own compose files.
    - name: Start Compose Services
      if: ${{ matrix.group == 'core' && matrix.go-version == env.LATEST_GO_VERSION }}
      run: |
        docker compose -f .github/workflows/apollo/docker-compose.yml up -d --build
        docker compose -f .github/workflows/nacos/docker-compose.yml up -d --build
        docker compose -f .github/workflows/redis/docker-compose.yml up -d --build
        docker compose -f .github/workflows/consul/docker-compose.yml up -d --build

    - name: Wait for Apollo to serve configuration
      if: ${{ matrix.group == 'core' && matrix.go-version == env.LATEST_GO_VERSION }}
      run: |
        # A running container is not enough: apollo-quick-start imports its seed
        # data after boot, and until that finishes the config service answers
        # normally but without the keys the tests read.
        for i in $(seq 1 60); do
          if curl -fsS --connect-timeout 2 --max-time 5 "http://localhost:8080/configs/SampleApp/default/application" | grep -Fq '"server.address"'; then
            echo "Apollo is serving configuration."
            exit 0
          fi
          sleep 5
        done
        echo "Apollo did not start serving configuration within 5 minutes."
        docker compose -f ".github/workflows/apollo/docker-compose.yml" logs --tail=50
        exit 1
      
    - name: Setup Golang ${{ matrix.go-version }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        # Cache is managed manually below: setup-go keys a single cache entry on all
        # `**/go.sum` files, which invalidates the whole cache whenever any of the 30+
        # submodules bumps a dependency.
        cache: false

    - name: Get current month
      id: cache-month
      run: echo "month=$(date +%Y%m)" >> "$GITHUB_OUTPUT"

    - name: Restore Go module cache
      id: mod-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-mod-main-${{ matrix.group == '386' && 'core' || matrix.group }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-mod-main-${{ matrix.group == '386' && 'core' || matrix.group }}-

    - name: Restore Go build cache
      id: build-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-go-build-main-${{ matrix.go-version }}-${{ matrix.group }}-${{ steps.cache-month.outputs.month }}
        restore-keys: |
          ${{ runner.os }}-go-build-main-${{ matrix.go-version }}-${{ matrix.group }}-

    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        version: "31.x"
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install the protocol compiler plugins for Go
      run: |
        # Pinned: protoc-gen-go-grpc v1.6.0 requires Go >= 1.24 and v1.6.2 requires
        # Go >= 1.25, either of which breaks the older matrix entries.
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
        export PATH="$PATH:$(go env GOPATH)/bin"

    - name: Before Script
      run:  bash .github/workflows/scripts/before_script.sh

    - name: Build & Test
      if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/master' }}
      run: bash .github/workflows/scripts/ci-main.sh ${{ matrix.group }}

    # Coverage is collected on master and on pull requests, so that a PR reports
    # its own coverage for the commit under test instead of relying on master's.
    - name: Build & Test & Coverage
      if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'pull_request' }}
      run: bash .github/workflows/scripts/ci-main.sh ${{ matrix.group }} coverage

    - name: Save Go module cache
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.go-version == env.LATEST_GO_VERSION && matrix.group != '386' && steps.mod-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ~/go/pkg/mod
        key: ${{ steps.mod-cache.outputs.cache-primary-key }}

    - name: Save Go build cache
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.build-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/go-build
        key: ${{ steps.build-cache.outputs.cache-primary-key }}

    # Runs even when the tests fail, so that a later step never waits on a container.
    - name: Stop Services
      if: always()
      run: |
        for service in apollo nacos redis consul; do
          docker compose -f ".github/workflows/$service/docker-compose.yml" down || true
        done
        bash .github/workflows/scripts/docker-services.sh clean || true

    - name: Report Coverage
      uses: codecov/codecov-action@v7
      # Reports on master and on pull requests, on the latest go version only. The flag
      # carries both dimensions, `go-<version>-<group>`, and .codecov.yml waits for all
      # of them before publishing statuses.
      #
      # `always()` is required: .codecov.yml waits for three uploads per commit, so a
      # leg that fails its tests must still upload whatever it produced, otherwise the
      # statuses of the commit stay pending forever. Failures here must not fail the CI
      # run either, as the token is not available to pull requests coming from forks;
      # those upload tokenlessly, as Codecov accepts tokenless uploads for the
      # `fork:branch` names the action derives for them.
      if: ${{ always() && (github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'pull_request') && matrix.go-version == env.LATEST_GO_VERSION && matrix.group != '386' }}
      with:
        flags: go-${{ matrix.go-version }}-${{ matrix.group }}
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
