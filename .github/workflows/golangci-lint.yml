name: golangci-lint
on:
  push:
    branches:
      - master
      - develop
      - personal/**
      - feature/**
      - enhance/**
      - fix/**
      - feat/**
  pull_request:
    branches:
      - master
      - develop
      - personal/**
      - feature/**
      - enhance/**
      - fix/**
      - feat/**

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  golang-ci:
    strategy:
      matrix:
        # Aligned with the `go` directive in go.mod, instead of "stable":
        # 1. `go` directive in go.mod is the minimum Go version this project supports,
        #    so lint runs on exactly that version to catch compatibility issues early.
        # 2. Using "stable" would drift with every new Go release, and golangci-lint
        #    bundles its own `go/types` which may fail to decode the export data of a
        #    newer Go version, producing confusing errors such as
        #    "export data version is greater than maximum supported version".
        # 3. When bumping the `go` directive in go.mod, update this value as well.
        go-version: [ "1.25" ]

    name: golang-ci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Golang ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: golang-ci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to a specific version to keep local and CI results identical.
          # Upgrading it may introduce new checks, so upgrade deliberately.
          version: v2.13.1
          only-new-issues: true
          skip-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          args: --config=.golangci.yml -v
